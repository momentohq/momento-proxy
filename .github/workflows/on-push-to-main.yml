name: on-push-to-main

on:
  push:
    branches: [main]

permissions:
  contents: write # to bump version, create a tag, write CHANGELOG, etc.
  pull-requests: write # to open/update the Release PR

env:
  IMAGE_NAME: gomomento/momento-proxy

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Release Please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.MOMENTO_MACHINE_USER_GITHUB_TOKEN }}

  publish-docker:
    name: Publish Docker Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Checkout tag ${{ needs.release-please.outputs.tag_name }}
        run: |
          git fetch --tags
          git checkout ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & push ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest-${{ matrix.suffix }}
            ${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.version }}-{{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    name: Create & push multi-arch manifest
    needs: publish-docker
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create & push "latest"
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:latest \
            --amend ${{ env.IMAGE_NAME }}:latest-amd64 \
            --amend ${{ env.IMAGE_NAME }}:latest-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:latest

      - name: Create & push versioned tag
        run: |
          VERSION=${{ needs.release-please.outputs.version }}
          docker manifest create ${{ env.IMAGE_NAME }}:${VERSION} \
            --amend ${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            --amend ${{ env.IMAGE_NAME }}:${VERSION}-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:${VERSION}

  build-binaries:
    name: Build & upload binaries (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            arch: arm64
          # Linux MUSL
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64-musl
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            arch: arm64-musl
          # macOS
          - os: macos-15
            target: x86_64-apple-darwin
            arch: macos-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            arch: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tag ${{ needs.release-please.outputs.tag_name }}
        run: |
          git fetch --tags
          git checkout ${{ needs.release-please.outputs.tag_name }}

      - name: Install cross-compilation tools (Linux only)
        if: startsWith(matrix.os, 'ubuntu')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build & upload to GitHub Release
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: momento_proxy
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          zip: none
          build-tool: cargo
          token: ${{ secrets.GITHUB_TOKEN }}
